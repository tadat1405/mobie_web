name: Release and Deploy

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/tadat1405/aurum-backend
  FRONTEND_IMAGE: ghcr.io/tadat1405/aurum-frontend
  ENV_FILE: /home/aurum/mobie_web/.env.prod

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: aurum_backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: aurum_frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy to server
    needs: build
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Pull and start new version
        env:
          HT_WRITE_KEY: ${{ secrets.HT_WRITE_KEY }}
          COOKIE_SECURE: ${{ vars.COOKIE_SECURE }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker compose -p mobie_web -f docker-compose.prod.yml --env-file "$ENV_FILE" pull
          docker compose -p mobie_web -f docker-compose.prod.yml --env-file "$ENV_FILE" up -d --no-build --remove-orphans
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost/ > /dev/null; then
              echo "Web OK (image ${IMAGE_TAG})"
              exit 0
            fi
            sleep 2
          done
          echo "Web không lên sau khi deploy"
          docker compose -p mobie_web -f docker-compose.prod.yml --env-file "$ENV_FILE" logs --tail=50
          exit 1
      - name: Dọn image cũ
        if: success()
        run: docker image prune -f
