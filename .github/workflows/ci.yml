name: CI

# Chạy trên develop và pull request. Nhánh master do workflow "Release and Deploy" lo.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./aurum_backend
      - run: docker build ./aurum_frontend
