# Chạy: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    # Không mở cổng ra ngoài: chỉ backend trong mạng Docker mới truy cập được
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5

  backend:
    build: ./aurum_backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGO_DB: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/aurum?authSource=admin
      ACCESS_TOKEN: ${ACCESS_TOKEN}
      REFRESH_TOKEN: ${REFRESH_TOKEN}
      CLINE_ID: ${CLINE_ID:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}

  frontend:
    build: ./aurum_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  mongo_data:
