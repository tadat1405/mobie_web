# Mongo cho môi trường dev (chạy: docker compose up -d)
# Tách project riêng để không bị `docker compose -f docker-compose.prod.yml up --remove-orphans` xóa nhầm
name: aurum_dev

services:
  mongo:
    image: mongo:7
    container_name: aurum_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
    external: true
    name: mobie_web_mobie_mongo_data
